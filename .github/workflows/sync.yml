name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 毎月 5 日 05:00 JST。品目表の改正は年に数回（主に 1 月 1 日と 4 月 1 日）
    - cron: "0 20 4 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: customs
    secrets: inherit
