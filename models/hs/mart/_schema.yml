version: 2

models:
- name: import_item
  access: public
  columns:
  - name: code
    data_tests: [not_null]
  - name: level
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [chapter, heading, subheading, statistical]
  - name: name
    data_tests: [not_null]
- name: export_item
  access: public
  columns:
  - name: code
    data_tests: [not_null]
  - name: level
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [chapter, heading, subheading, statistical]
  - name: name
    data_tests: [not_null]
